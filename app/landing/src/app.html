<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#050506" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preload" href="%sveltekit.assets%/fonts/mona-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/mona-sans-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Theme before first paint (no flash). Preference lives in localStorage only after the user
			// clicks the toggle: a user-requested, strictly necessary storage (ePrivacy art. 5(3) exemption).
			// The showcase pages (home, results, cards explorer) are dark-only: their cinematic scenes have no light variant.
			// Stale HTML after a deploy can reference hashed chunks that no longer exist. The SSR page
			// is complete without JS, so nothing is half-rendered; reload once to pick up the new build.
			addEventListener('vite:preloadError', function () {
				try {
					if (sessionStorage.getItem('chunk-reload')) return;
					sessionStorage.setItem('chunk-reload', '1');
				} catch (e) {
					return;
				}
				location.reload();
			});
			(function () {
				document.documentElement.classList.add('js');
				if (/^\/(pl|en)\/((karty|cards|wyniki|results)\/.*)?$/.test(location.pathname)) {
					document.documentElement.setAttribute('data-theme', 'dark');
					document.documentElement.setAttribute('data-showcase', '');
					return;
				}
				try {
					var t = localStorage.getItem('theme');
					// Dark is the brand default on every page; light only when the visitor picks it with the toggle.
					if (t !== 'light' && t !== 'dark') t = 'dark';
					document.documentElement.setAttribute('data-theme', t);
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
		%sveltekit.head%
		<!-- Icons at the root are declared here (not at the top of <head>) because that is where the
		     live page has them; markup otherwise identical. -->
		<link rel="icon" href="/favicon.ico" sizes="32x32">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
		<!-- Server-side overlays, kept as plain static files (not bundled): the live site loads them
		     this way and `?v=` is the cache-bump rule — bump it whenever the file changes. -->
		<link rel="stylesheet" href="/poprawki.css?v=3" />
		<script src="/poprawki.js?v=1" defer></script>
		<script>
			// Analytics loads only after an explicit "accept" (ePrivacy art. 5(3)); /ruch.js is a
			// shared script served from the host, not part of this build.
			(function () {
				function z() {
					try {
						var c = JSON.parse(localStorage.getItem('consent') || 'null');
						return !!(c && c.v === 1 && c.analytics === true);
					} catch (e) {
						return false;
					}
				}
				window.RuchZgoda = z;
				var w = 0;
				function l() {
					if (w || !z()) return;
					w = 1;
					var s = document.createElement('script');
					s.src = '/ruch.js?v=2';
					document.head.appendChild(s);
				}
				l();
				addEventListener('click', function () { setTimeout(l, 0); }, true);
				addEventListener('storage', l);
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
